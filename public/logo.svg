<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Avio">
  <title>Avio</title>
  <!-- Quadcopter seen from above: the frame in ink, the rotor discs in zone blue. -->
  <!-- Arms take the blue so the mark survives on a dark tab bar as well as on paper. -->
  <g stroke="#1b6ca8" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M8.4 8.4 23.6 23.6" />
    <path d="M23.6 8.4 8.4 23.6" />
  </g>
  <g stroke="#1b6ca8" stroke-width="2.4" fill="#edefec">
    <circle cx="8.4" cy="8.4" r="4.4" />
    <circle cx="23.6" cy="8.4" r="4.4" />
    <circle cx="8.4" cy="23.6" r="4.4" />
    <circle cx="23.6" cy="23.6" r="4.4" />
  </g>
  <circle fill="#14181c" cx="16" cy="16" r="4.2" />
</svg>
