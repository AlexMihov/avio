<dz-header
  [heightM]="heightM()"
  [locating]="locating()"
  (heightChanged)="heightM.set($event)"
  (coordsSubmitted)="onPointPicked($event)"
  (locateRequested)="locate()"
  (sourcesChanged)="onSourcesChanged($event)"
/>

<main>
  <aside>
    <div class="results">
      <dz-result-panel
        [matches]="matches()"
        [heightM]="heightM()"
        [point]="point()"
        (hovered)="highlightedId.set($event)"
      />
    </div>

    <section class="legend">
      <span class="compartment-label">{{ i18n.t('legend.title') }}</span>
      <ul>
        <li data-restriction="PROHIBITED">{{ i18n.t('verdict.PROHIBITED') }}</li>
        <li data-restriction="REQ_AUTHORISATION">{{ i18n.t('verdict.REQ_AUTHORISATION') }}</li>
        <li data-restriction="CONDITIONAL">{{ i18n.t('verdict.CONDITIONAL') }}</li>
        <li data-restriction="NO_RESTRICTION">{{ i18n.t('verdict.NO_RESTRICTION') }}</li>
      </ul>
    </section>
  </aside>

  <dz-map
    [zones]="mapZones()"
    [highlightedId]="highlightedId()"
    [point]="point()"
    [view]="view()"
    (pointPicked)="onPointPicked($event)"
  />
</main>

<dz-footer />
<dz-consent-banner />
