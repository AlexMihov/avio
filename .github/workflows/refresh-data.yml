name: Refresh zone data

on:
  schedule:
    # Daily, shortly after the authority's usual working hours.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Each source is isolated: one authority being unreachable no longer stops the other
      # six refreshing. The step is allowed to fail so that whatever did refresh still gets
      # committed, and the job is marked red at the end.
      - id: data
        run: npm run data
        continue-on-error: true

      - run: npm test

      - name: Commit refreshed data
        if: always()
        run: |
          if git diff --quiet -- public/data; then
            echo "No change in published zones."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "data: refresh zones ($(date -u +%Y-%m-%d))"
          git push

      - name: Fail if any source could not be refreshed
        if: steps.data.outcome == 'failure'
        run: |
          echo "At least one source failed to refresh; see the 'npm run data' step." >&2
          exit 1
